<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="مهامي">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#2563eb">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%85%3C/text%3E%3C/svg%3E">
  <title>مهامي</title>
  <style>
    :root {
      --bg: #f2f4f8;
      --card: #ffffff;
      --text: #1c2430;
      --muted: #6b7280;
      --accent: #2563eb;
      --danger: #dc2626;
      --line: #e5e7eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f141c;
        --card: #1a2230;
        --text: #e8edf5;
        --muted: #9aa4b2;
        --accent: #60a5fa;
        --danger: #f87171;
        --line: #2a3445;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, system-ui, "Segoe UI", Tahoma, sans-serif;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      -webkit-text-size-adjust: 100%;
    }
    .app {
      max-width: 520px;
      margin: 0 auto;
      padding: 16px;
    }
    header h1 { margin: 8px 0 4px; font-size: 28px; }
    header p { margin: 0 0 16px; color: var(--muted); font-size: 15px; min-height: 1em; }

    .add { display: flex; gap: 8px; margin-bottom: 16px; }
    .add input {
      flex: 1;
      min-width: 0;
      height: 48px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--card);
      color: var(--text);
      font-size: 16px; /* 16px prevents iOS Safari from zooming on focus */
    }
    .add button {
      height: 48px;
      padding: 0 18px;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 56px;
      padding: 8px 8px 8px 12px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
    }
    .item .text {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
      font-size: 17px;
    }
    .item.done .text { color: var(--muted); text-decoration: line-through; }
    .check {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      border: 2px solid var(--accent);
      border-radius: 50%;
      background: transparent;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
    }
    .item.done .check { background: var(--accent); }
    .remove {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--danger);
      font-size: 22px;
      cursor: pointer;
    }
    .empty { text-align: center; color: var(--muted); margin: 40px 0; }
    .empty[hidden] { display: none; }
    .footer { display: flex; justify-content: center; margin: 20px 0; }
    .footer button {
      min-height: 44px;
      padding: 0 16px;
      border: 0;
      background: transparent;
      color: var(--accent);
      font-size: 16px;
      cursor: pointer;
    }
    .footer button:disabled { color: var(--muted); cursor: default; }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>مهامي</h1>
      <p id="summary"></p>
    </header>

    <form id="addForm" class="add" autocomplete="off">
      <input id="newTask" type="text" maxlength="120" placeholder="أضف مهمة جديدة…" aria-label="مهمة جديدة">
      <button type="submit">إضافة</button>
    </form>

    <ul id="list" class="list"></ul>
    <p id="empty" class="empty">لا توجد مهام بعد</p>

    <div class="footer">
      <button id="clearDone" type="button">حذف المكتملة</button>
    </div>
  </main>

  <script>
    (function () {
      var KEY = "iphone-todo.tasks";

      var form = document.getElementById("addForm");
      var input = document.getElementById("newTask");
      var list = document.getElementById("list");
      var empty = document.getElementById("empty");
      var summary = document.getElementById("summary");
      var clearDone = document.getElementById("clearDone");

      var tasks = load();

      function load() {
        try {
          var data = JSON.parse(localStorage.getItem(KEY) || "[]");
          return Array.isArray(data) ? data : [];
        } catch (e) {
          return [];
        }
      }

      function save() {
        try {
          localStorage.setItem(KEY, JSON.stringify(tasks));
        } catch (e) {
          // Storage can be unavailable (private mode); the app still works for this session.
        }
      }

      function newId() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2);
      }

      function render() {
        var doneCount = tasks.filter(function (t) { return t.done; }).length;

        list.textContent = "";
        tasks.forEach(function (task) {
          var li = document.createElement("li");
          li.className = "item" + (task.done ? " done" : "");

          var check = document.createElement("button");
          check.type = "button";
          check.className = "check";
          check.dataset.action = "toggle";
          check.dataset.id = task.id;
          check.setAttribute("aria-label", task.done ? "إلغاء الإكمال" : "تمييز كمكتملة");
          check.textContent = task.done ? "✓" : "";

          var text = document.createElement("span");
          text.className = "text";
          text.textContent = task.text;

          var remove = document.createElement("button");
          remove.type = "button";
          remove.className = "remove";
          remove.dataset.action = "remove";
          remove.dataset.id = task.id;
          remove.setAttribute("aria-label", "حذف المهمة");
          remove.textContent = "×";

          li.appendChild(check);
          li.appendChild(text);
          li.appendChild(remove);
          list.appendChild(li);
        });

        empty.hidden = tasks.length > 0;
        summary.textContent = tasks.length
          ? doneCount + " من " + tasks.length + " مكتملة"
          : "";
        clearDone.disabled = doneCount === 0;
      }

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        var text = input.value.trim();
        if (!text) {
          input.focus();
          return;
        }
        tasks.unshift({ id: newId(), text: text, done: false });
        input.value = "";
        save();
        render();
        input.focus();
      });

      list.addEventListener("click", function (event) {
        var button = event.target.closest("button[data-action]");
        if (!button) return;
        var id = button.dataset.id;
        if (button.dataset.action === "toggle") {
          tasks.forEach(function (t) {
            if (t.id === id) t.done = !t.done;
          });
        } else if (button.dataset.action === "remove") {
          tasks = tasks.filter(function (t) { return t.id !== id; });
        }
        save();
        render();
      });

      clearDone.addEventListener("click", function () {
        tasks = tasks.filter(function (t) { return !t.done; });
        save();
        render();
      });

      render();
    })();
  </script>
</body>
</html>
